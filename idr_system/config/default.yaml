# idr_system/config/default.yaml

train:
  epochs: 60
  batch_size: 32
  optimizer: AdamW
  lr: 3.0e-4                # was 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 0.5            # was 1.0 — tighten
  warmup_epochs: 5          # new
  early_stop_patience: 8
  seed: 42
  smooth_l1_beta: 1.0
  loss_traj_scale: 0.05     # new
  loss_speed_scale: 1.0     # new
data:
  sample_rate_hz: 10
  imu_gnss_lag_sec: 0.5
  merge_tolerance_sec: 0.2
  vibration_cutoff_hz: 2.5
  gravity_norm: 9.81
  shock_sigma_threshold: 3.0
  gravity_lp_tau_sec: 2.0
  remount_speed_threshold_kmh: 15.0
  remount_max_yaw_rate_deg_s: 2.0
  min_sats_valid: 6
  max_gps_acc_valid: 10.0
  max_bad_gps_fraction: 0.05
  window_durations_sec: [15, 30, 60]

model:
  mtn:
    input_channels: 7
    sequence_length: 30
    hidden_dim: 64
    dropout: 0.2
    dilations_fast: [1, 2, 4]
    dilations_slow: [4, 8, 16, 32]
  noise_net:
    input_channels: 147
    sequence_length: 30
    hidden_dim: 128
    dropout: 0.0

ekf:
  dt: 0.1
  q_diag: [1.0e-4, 1.0e-4, 1.0e-4, 1.0e-2, 1.0e-2, 1.0e-2, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-6, 1.0e-6, 1.0e-6, 1.0e-8, 1.0e-8, 1.0e-8, 1.0e-9, 1.0e-6, 1.0e-2]
  r_gps_base: 0.1
  r_gps_age_exponent: 1.5
  r_nhc: 0.01
  r_yaw_straight: 0.0396  # (11.4 deg)^2 in rad^2
  r_map_match: 0.0076     # (5 deg)^2 in rad^2
  straight_yaw_rate_thresh_deg_s: 5.0
  stat_accel_thresh: 0.1
  stat_gyro_thresh: 0.01
  stat_dur_sec: 2.0
